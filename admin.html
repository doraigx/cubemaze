<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CUBE EDGE - 管理者専用ダッシュボード & エディタ</title>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Meiryo, sans-serif;
      color: #fff;
    }

    #admin-list-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
      background: #0f172a;
      z-index: 20;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 16px;
    }

    .tabs-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab-btn {
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
    }

    button, select, input {
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      background-color: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background-color: #475569;
    }

    input[type="text"], input[type="number"] {
      cursor: text;
      background-color: #1e293b;
      border: 1px solid #38bdf8;
      outline: none;
      text-align: center;
      -webkit-user-select: text;
      user-select: text;
    }

    .card {
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .stage-list-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      overflow-y: auto;
    }

    .stage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 6px;
      gap: 12px;
    }

    .user-group {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-group-title {
      font-weight: bold;
      font-size: 1rem;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-public { background: #059669; }
    .badge-hidden { background: #dc2626; }
    .badge-draft { background: #8b5cf6; }

    #editor-ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .editor-bar {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(4px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      pointer-events: auto;
      align-items: center;
      flex-wrap: wrap;
    }

    .palette-btn {
      border: 2px solid transparent;
      border-radius: 4px;
    }
    .palette-btn.active {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .p-empty { background: #334155; }
    .p-floor { background: #64748b; }
    .p-full { background: #475569; border: 1px dashed #94a3b8; }
    .p-goal { background: #eab308; color: #000; }
    .p-start { background: #06b6d4; color: #000; }
    .p-mover { background: #a855f7; color: #fff; }
    .p-checkpoint { background: #ec4899; color: #fff; }
    .p-fallfloor { background: #f97316; color: #fff; }

    .modal-dialog {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e293b;
      border: 2px solid #38bdf8;
      padding: 20px;
      border-radius: 8px;
      color: #fff;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .hud-control-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 15;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <div id="admin-list-view">
    <div class="header-bar">
      <div>
        <h1 style="margin:0; font-size:1.6rem; color:#ef4444;">🛡️ CUBE EDGE 管理者コンソール</h1>
        <span id="auth-status" style="font-size:12px; color:#94a3b8;">認証確認中...</span>
      </div>
      <div style="display:flex; gap:10px;">
        <button id="btn-auth" style="background:#0284c7;">Googleログイン</button>
      </div>
    </div>

    <!-- ページ切り替えタブ -->
    <div class="tabs-bar">
      <button id="tab-public-stages" class="tab-btn active">🌐 公開ステージ一覧</button>
      <button id="tab-user-drafts" class="tab-btn">👥 ユーザー別作成中ステージ</button>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="card-title" style="margin:0;">公開ステージ一覧</h3>
        <button id="btn-refresh" style="background:#0284c7;">一覧を更新</button>
      </div>
      <div id="stage-list" class="stage-list-box">
        <div style="text-align:center; color:#64748b;">読み込み中...</div>
      </div>
    </div>
  </div>

  <!-- エディターUI -->
  <div id="editor-ui-container" class="hidden">
    <div class="editor-bar">
      <span style="font-weight: bold; color: #ef4444;">[管理編集]</span>
      <span style="font-weight: bold;">ステージ名:</span>
      <input type="text" id="input-editor-stage-name" style="width: 140px; text-align: left; padding: 4px 8px;" maxlength="20">

      <span style="font-weight: bold; margin-left: 6px;">サイズ:</span>
      <select id="select-grid-size">
        <option value="16">16 × 16</option>
        <option value="32" selected>32 × 32</option>
        <option value="48">48 × 48</option>
        <option value="64">64 × 64</option>
      </select>

      <span style="font-weight: bold; margin-left: 6px;">階層(Y):</span>
      <button id="btn-layer-down">▼</button>
      <span id="label-layer" style="min-width: 45px; text-align: center; color: #38bdf8; font-weight: bold;">Y: 0</span>
      <button id="btn-layer-up">▲</button>

      <span style="font-weight: bold; margin-left: 6px;">パーツ:</span>
      <button class="palette-btn p-floor active" data-type="1">薄い床</button>
      <button class="palette-btn p-full" data-type="5">直方体</button>
      <button class="palette-btn p-mover" data-type="4">動く床</button>
      <button class="palette-btn p-checkpoint" data-type="6">セーブ</button>
      <button class="palette-btn p-fallfloor" data-type="7">落下床</button>
      <button class="palette-btn p-start" data-type="3">スタート</button>
      <button class="palette-btn p-goal" data-type="2">ゴール</button>
      <button class="palette-btn p-empty" data-type="0">消去</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div class="editor-bar" style="font-size:12px; color:#94a3b8;">
        左ドラッグ: 設置/削除 | 右ドラッグ: 移動 | ホイール回転: 視点回転
      </div>
      <div class="editor-bar">
        <button id="btn-admin-save" style="background:#059669;">ステージを上書き保存</button>
        <button id="btn-admin-test" style="background:#2563eb;">テストプレイ</button>
        <button id="btn-admin-back-list" style="background:#475569;">一覧に戻る</button>
      </div>
    </div>
  </div>

  <button id="hud-back-editor" class="hud-control-btn hidden" style="background: #e11d48;">エディタに戻る</button>

  <div id="editor-modal" class="modal-dialog hidden">
    <h3 style="margin: 0;">動く床の設定</h3>
    <label>進行方向:
      <select id="modal-dir">
        <option value="UP">↑ (奥へ移動)</option>
        <option value="DOWN">↓ (手前へ移動)</option>
        <option value="LEFT">← (左へ移動)</option>
        <option value="RIGHT">→ (右へ移動)</option>
        <option value="Y_UP">▲ (上へ上昇)</option>
        <option value="Y_DOWN">▼ (下へ下降)</option>
      </select>
    </label>
    <label>往復距離:
      <select id="modal-dist">
        <option value="1">1マス</option>
        <option value="2">2マス</option>
        <option value="3" selected>3マス</option>
        <option value="4">4マス</option>
        <option value="5">5マス</option>
        <option value="6">6マス</option>
      </select>
    </label>
    <label>速度:
      <select id="modal-speed">
        <option value="0.02">遅い</option>
        <option value="0.035" selected>普通</option>
        <option value="0.06">速い</option>
      </select>
    </label>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
      <button id="modal-save" style="background: #0284c7;">決定</button>
      <button id="modal-cancel">閉じる</button>
    </div>
  </div>

  <div id="modal-checkpoint" class="modal-dialog hidden">
    <h3 style="margin: 0;">セーブ地点の設定</h3>
    <label>セーブ番号:
      <input type="number" id="cp-number-input" min="1" max="99" value="1" style="width: 80px;">
    </label>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
      <button id="cp-modal-save" style="background: #0284c7;">決定</button>
      <button id="cp-modal-cancel">閉じる</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    window.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; }, { passive: false });

    const firebaseConfig = {
      apiKey: "AIzaSyBq5Wqx7kwqQSf9spIfrgHjYdQ7qm-yPzs",
      authDomain: "cubemaze-65594.firebaseapp.com",
      projectId: "cubemaze-65594",
      storageBucket: "cubemaze-65594.firebasestorage.app",
      messagingSenderId: "94155316782",
      appId: "1:94155316782:web:9dc3320c9e938ee16689bf",
      measurementId: "G-NJTJ4DJ6JY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const authStatus = document.getElementById('auth-status');
    const btnAuth = document.getElementById('btn-auth');
    const stageList = document.getElementById('stage-list');
    const cardTitle = document.getElementById('card-title');
    const adminListView = document.getElementById('admin-list-view');
    const editorUiContainer = document.getElementById('editor-ui-container');
    const hudBackEditor = document.getElementById('hud-back-editor');
    const inputEditorStageName = document.getElementById('input-editor-stage-name');

    const tabPublicStages = document.getElementById('tab-public-stages');
    const tabUserDrafts = document.getElementById('tab-user-drafts');

    let currentUser = null;
    let currentTab = 'PUBLIC'; // 'PUBLIC' or 'USER_DRAFTS'
    let currentEditingTarget = null; // { type: 'PUBLIC' | 'DRAFT', docId, userId }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        authStatus.textContent = `管理者: ${user.displayName || user.email} (${user.uid})`;
        btnAuth.textContent = "ログアウト";
        loadCurrentTab();
      } else {
        authStatus.textContent = "未ログイン";
        btnAuth.textContent = "Googleログイン";
        stageList.innerHTML = '<div style="color:#ef4444; text-align:center;">ログインしてください</div>';
      }
    });

    btnAuth.onclick = () => {
      if (currentUser) {
        auth.signOut();
      } else {
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert("ログインエラー: " + e.message));
      }
    };

    tabPublicStages.onclick = () => {
      currentTab = 'PUBLIC';
      tabPublicStages.classList.add('active');
      tabUserDrafts.classList.remove('active');
      cardTitle.textContent = "公開ステージ一覧";
      loadCurrentTab();
    };

    tabUserDrafts.onclick = () => {
      currentTab = 'USER_DRAFTS';
      tabUserDrafts.classList.add('active');
      tabPublicStages.classList.remove('active');
      cardTitle.textContent = "ユーザー別作成中ステージ一覧";
      loadCurrentTab();
    };

    document.getElementById('btn-refresh').onclick = () => loadCurrentTab();

    function loadCurrentTab() {
      if (currentTab === 'PUBLIC') loadPublicStages();
      else loadUserDrafts();
    }

    // 1. 公開ステージ一覧
    async function loadPublicStages() {
      if (!currentUser) return;
      stageList.innerHTML = '<div style="color:#64748b; text-align:center;">読み込み中...</div>';
      try {
        const snap = await db.collection("stages").orderBy("createdAt", "desc").limit(50).get();
        if (snap.empty) {
          stageList.innerHTML = '<div style="color:#64748b; text-align:center;">公開ステージはありません</div>';
          return;
        }
        stageList.innerHTML = '';
        snap.forEach(doc => {
          const s = doc.data();
          let isHidden = !!s.hidden;
          const item = document.createElement('div');
          item.className = 'stage-item';
          item.innerHTML = `
            <div>
              <strong style="font-size:1.1rem; color:#facc15;">${s.name || "名称未設定"}</strong>
              <span class="badge ${isHidden ? 'badge-hidden' : 'badge-public'}">${isHidden ? '非表示中' : '公開中'}</span>
              <div style="font-size:12px; color:#94a3b8; margin-top:4px;">
                ID: <code>${doc.id}</code> | 作者: ${s.author || "不明"} (${s.size}×${s.size})
              </div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn-edit" style="background:#2563eb;">編集</button>
              <button class="btn-hide" style="background:${isHidden ? '#059669' : '#d97706'};">${isHidden ? '公開にする' : '非表示にする'}</button>
              <button class="btn-del" style="background:#dc2626;">削除</button>
            </div>
          `;

          item.querySelector('.btn-edit').onclick = () => {
            currentEditingTarget = { type: 'PUBLIC', docId: doc.id };
            openEditorWithStage(s);
          };

          const btnHide = item.querySelector('.btn-hide');
          const badge = item.querySelector('.badge');
          btnHide.onclick = async () => {
            const nextHidden = !isHidden;
            btnHide.disabled = true;
            try {
              await db.collection("stages").doc(doc.id).update({ hidden: nextHidden });
              isHidden = nextHidden;
              badge.className = `badge ${isHidden ? 'badge-hidden' : 'badge-public'}`;
              badge.textContent = isHidden ? '非表示中' : '公開中';
              btnHide.style.background = isHidden ? '#059669' : '#d97706';
              btnHide.textContent = isHidden ? '公開にする' : '非表示にする';
            } catch(e) {
              alert("更新エラー: " + e.message);
            } finally {
              btnHide.disabled = false;
            }
          };

          item.querySelector('.btn-del').onclick = async () => {
            if (confirm(`公開ステージ「${s.name}」(ID: ${doc.id}) を削除しますか？`)) {
              try {
                await db.collection("stages").doc(doc.id).delete();
                item.remove();
              } catch(e) {
                alert("削除エラー: " + e.message);
              }
            }
          };

          stageList.appendChild(item);
        });
      } catch (e) {
        stageList.innerHTML = `<div style="color:#ef4444; text-align:center;">読込エラー: ${e.message}</div>`;
      }
    }

    // 2. ユーザー別作成中ステージ一覧
    async function loadUserDrafts() {
      if (!currentUser) return;
      stageList.innerHTML = '<div style="color:#64748b; text-align:center;">ユーザーの作成中データを読み込み中...</div>';
      try {
        const usersSnap = await db.collection("users").get();
        if (usersSnap.empty) {
          stageList.innerHTML = '<div style="color:#64748b; text-align:center;">ユーザーデータがありません</div>';
          return;
        }

        stageList.innerHTML = '';
        let totalDrafts = 0;

        for (const userDoc of usersSnap.docs) {
          const uData = userDoc.data();
          const userId = userDoc.id;
          const uName = uData.username || "名称未設定";

          const draftsSnap = await db.collection("users").doc(userId).collection("custom_stages").orderBy("updatedAt", "desc").get();
          if (draftsSnap.empty) continue;

          totalDrafts += draftsSnap.size;
          const userGroup = document.createElement('div');
          userGroup.className = 'user-group';
          userGroup.innerHTML = `
            <div class="user-group-title">
              <span>👤 ${uName} <span style="font-size:11px; color:#94a3b8;">(UID: ${userId})</span></span>
              <span class="badge badge-draft">${draftsSnap.size}件の下書き</span>
            </div>
            <div class="draft-items-container" style="display:flex; flex-direction:column; gap:6px;"></div>
          `;

          const container = userGroup.querySelector('.draft-items-container');

          draftsSnap.forEach(dDoc => {
            const d = dDoc.data();
            const item = document.createElement('div');
            item.className = 'stage-item';
            item.style.background = '#1e293b';
            item.innerHTML = `
              <div>
                <strong style="color:#38bdf8;">${d.name || "名称未設定"}</strong>
                <span style="font-size:11px; color:#94a3b8; margin-left:6px;">(${d.size}×${d.size})</span>
                <div style="font-size:11px; color:#64748b; margin-top:2px;">
                  更新: ${d.updatedAt ? new Date(d.updatedAt.toDate()).toLocaleString() : '不明'}
                </div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="btn-edit-draft" style="background:#0284c7; padding:4px 10px; font-size:12px;">編集・監視</button>
                <button class="btn-del-draft" style="background:#dc2626; padding:4px 10px; font-size:12px;">削除</button>
              </div>
            `;

            item.querySelector('.btn-edit-draft').onclick = () => {
              currentEditingTarget = { type: 'DRAFT', docId: dDoc.id, userId: userId };
              openEditorWithStage(d);
            };

            item.querySelector('.btn-del-draft').onclick = async () => {
              if (confirm(`ユーザー「${uName}」のステージスロット「${d.name}」を削除しますか？`)) {
                try {
                  await db.collection("users").doc(userId).collection("custom_stages").doc(dDoc.id).delete();
                  item.remove();
                } catch(e) {
                  alert("削除エラー: " + e.message);
                }
              }
            };

            container.appendChild(item);
          });

          stageList.appendChild(userGroup);
        }

        if (totalDrafts === 0) {
          stageList.innerHTML = '<div style="color:#64748b; text-align:center;">作成中のステージスロットは現在ありません</div>';
        }
      } catch (e) {
        stageList.innerHTML = `<div style="color:#ef4444; text-align:center;">読込エラー: ${e.message}</div>`;
      }
    }

    /* 3Dエンジン・エディタ実装 */
    const MIN_HEIGHT = -5;
    const MAX_HEIGHT = 10;
    let gridSize = 32;
    let currentLayer = 0;
    let gameState = 'LIST';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111118);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const thinTileGeo = new THREE.BoxGeometry(1, 0.2, 1);
    const fullBlockGeo = new THREE.BoxGeometry(1, 1, 1);

    const matFloor = new THREE.MeshLambertMaterial({ color: 0x64748b });
    const matFull = new THREE.MeshLambertMaterial({ color: 0x475569 });
    const matGoal = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
    const matStart = new THREE.MeshLambertMaterial({ color: 0x06b6d4 });
    const matMover = new THREE.MeshLambertMaterial({ color: 0xa855f7 });
    const matFallFloor = new THREE.MeshLambertMaterial({ color: 0xf97316 });

    function createCheckpointMaterials(number = 1) {
      const cv = document.createElement('canvas');
      cv.width = 128; cv.height = 128;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ec4899';
      ctx.fillRect(0, 0, 128, 128);
      ctx.lineWidth = 8; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(4, 4, 120, 120);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 64px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(number.toString(), 64, 64);

      const tex = new THREE.CanvasTexture(cv);
      const topMat = new THREE.MeshLambertMaterial({ map: tex });
      const sideMat = new THREE.MeshLambertMaterial({ color: 0xec4899 });
      return [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];
    }

    let cubePos = { x: 0, y: 0, z: 0 };
    const cubeMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15 }));
    cubeMesh.castShadow = true;
    const pivot = new THREE.Group();
    scene.add(pivot);
    pivot.add(cubeMesh);
    pivot.visible = false;

    const cameraTarget = new THREE.Vector3();
    const tilesGroup = new THREE.Group();
    scene.add(tilesGroup);
    tilesGroup.visible = false;

    const editorGroup = new THREE.Group();
    scene.add(editorGroup);
    editorGroup.visible = false;

    let activeMovers = [];
    let activeFallingFloors = [];
    let editorBlocks = new Map();
    let editorMeshMap = new Map();
    let selectedPalette = 1;
    let gridHelper = null;
    let raycastPlane = null;

    let editorCamRadius = 35;
    let editorCamTheta = Math.PI / 4;
    let editorCamPhi = Math.PI / 3;
    const editorCamPos = new THREE.Vector3();
    const editorCamTarget = new THREE.Vector3();

    function updateEditorCamPos() {
      editorCamPos.x = editorCamTarget.x + editorCamRadius * Math.sin(editorCamPhi) * Math.sin(editorCamTheta);
      editorCamPos.y = editorCamTarget.y + editorCamRadius * Math.cos(editorCamPhi);
      editorCamPos.z = editorCamTarget.z + editorCamRadius * Math.sin(editorCamPhi) * Math.cos(editorCamTheta);
    }

    function buildEditorGrid() {
      if (gridHelper) { editorGroup.remove(gridHelper); gridHelper.geometry.dispose(); }
      if (raycastPlane) { editorGroup.remove(raycastPlane); raycastPlane.geometry.dispose(); }

      gridHelper = new THREE.GridHelper(gridSize, gridSize, 0x0ea5e9, 0x334155);
      gridHelper.position.set(gridSize / 2 - 0.5, currentLayer - 0.01, gridSize / 2 - 0.5);
      editorGroup.add(gridHelper);

      const planeGeo = new THREE.PlaneGeometry(gridSize, gridSize);
      raycastPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
      raycastPlane.rotation.x = -Math.PI / 2;
      raycastPlane.position.set(gridSize / 2 - 0.5, currentLayer, gridSize / 2 - 0.5);
      editorGroup.add(raycastPlane);
    }

    function updateLayerDisplay() {
      document.getElementById('label-layer').textContent = `Y: ${currentLayer}`;
      if (gridHelper && raycastPlane) {
        gridHelper.position.y = currentLayer - 0.01;
        raycastPlane.position.y = currentLayer;
      }
      editorMeshMap.forEach((mesh, key) => {
        const y = parseInt(key.split(',')[1], 10);
        const targetOpacity = (y === currentLayer) ? 1.0 : 0.35;
        if (Array.isArray(mesh.material)) {
          mesh.material.forEach(m => { m.transparent = true; m.opacity = targetOpacity; });
        } else {
          mesh.material.transparent = true;
          mesh.material.opacity = targetOpacity;
        }
      });
    }

    document.getElementById('btn-layer-up').onclick = () => { if (currentLayer < MAX_HEIGHT) { currentLayer++; updateLayerDisplay(); } };
    document.getElementById('btn-layer-down').onclick = () => { if (currentLayer > MIN_HEIGHT) { currentLayer--; updateLayerDisplay(); } };

    document.getElementById('select-grid-size').onchange = (e) => {
      gridSize = parseInt(e.target.value, 10);
      buildEditorGrid();
      editorCamTarget.set(gridSize / 2, 0, gridSize / 2);
      editorCamRadius = gridSize * 1.05;
      updateEditorCamPos();
    };

    function setEditorTile(x, y, z, type, moverConfig = null, cpIndex = null) {
      const key = `${x},${y},${z}`;

      if (type === 3) {
        editorBlocks.forEach((val, k) => {
          if (val.type === 3) {
            const [cx, cy, cz] = k.split(',').map(Number);
            setEditorTile(cx, cy, cz, 0);
          }
        });
      }

      if (type === 0) {
        editorBlocks.delete(key);
        if (editorMeshMap.has(key)) {
          editorGroup.remove(editorMeshMap.get(key));
          editorMeshMap.delete(key);
        }
      } else {
        const cNum = (type === 6) ? (cpIndex || 1) : null;
        const data = {
          type,
          moverConfig: moverConfig || (type === 4 ? { dir: 'RIGHT', dist: 3, speed: 0.035 } : null),
          cpIndex: cNum
        };
        editorBlocks.set(key, data);

        if (editorMeshMap.has(key)) editorGroup.remove(editorMeshMap.get(key));

        let geo = (type === 5) ? fullBlockGeo : thinTileGeo;
        let m = matFloor.clone();
        let isMultiMat = false;

        if (type === 5) m = matFull.clone();
        else if (type === 2) m = matGoal.clone();
        else if (type === 3) m = matStart.clone();
        else if (type === 4) m = matMover.clone();
        else if (type === 7) m = matFallFloor.clone();
        else if (type === 6) {
          m = createCheckpointMaterials(cNum);
          isMultiMat = true;
        }

        const mesh = new THREE.Mesh(geo, m);
        mesh.position.set(x, y + ((type === 5) ? 0.5 : -0.1), z);

        const isCurrent = (y === currentLayer);
        if (isMultiMat) {
          mesh.material.forEach(mat => { mat.transparent = true; mat.opacity = isCurrent ? 1.0 : 0.35; });
        } else {
          mesh.material.transparent = true;
          mesh.material.opacity = isCurrent ? 1.0 : 0.35;
        }

        editorGroup.add(mesh);
        editorMeshMap.set(key, mesh);
      }
    }

    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedPalette = parseInt(btn.dataset.type, 10);
      };
    });

    function openEditorWithStage(stageData) {
      adminListView.classList.add('hidden');
      editorUiContainer.classList.remove('hidden');
      hudBackEditor.classList.add('hidden');

      gameState = 'EDITOR';
      pivot.visible = false;
      tilesGroup.visible = false;
      editorGroup.visible = true;

      inputEditorStageName.value = stageData.name || "ステージ";
      editorBlocks.forEach((_, k) => {
        const [x, y, z] = k.split(',').map(Number);
        setEditorTile(x, y, z, 0);
      });

      gridSize = stageData.size || 32;
      document.getElementById('select-grid-size').value = gridSize;
      buildEditorGrid();

      stageData.blocks.forEach(b => setEditorTile(b.x, b.y, b.z, b.type, null, b.cpIndex));
      if (stageData.movers) {
        stageData.movers.forEach(m => setEditorTile(m.x, m.y, m.z, 4, { dir: m.dir, dist: m.dist, speed: m.speed }));
      }
      if (stageData.spawn) setEditorTile(stageData.spawn.x, stageData.spawn.y, stageData.spawn.z, 3);
      updateLayerDisplay();

      editorCamRadius = gridSize * 1.05;
      editorCamTheta = Math.PI / 4;
      editorCamPhi = Math.PI / 3;
      editorCamTarget.set(gridSize / 2, 0, gridSize / 2);
      updateEditorCamPos();
      camera.position.copy(editorCamPos);
      camera.lookAt(editorCamTarget);
    }

    document.getElementById('btn-admin-back-list').onclick = () => {
      editorGroup.visible = false;
      tilesGroup.visible = false;
      pivot.visible = false;
      editorUiContainer.classList.add('hidden');
      adminListView.classList.remove('hidden');
      gameState = 'LIST';
      loadCurrentTab();
    };

    function exportStageData() {
      let spawn = null;
      let hasGoal = false;
      const blocks = [];
      const movers = [];

      editorBlocks.forEach((val, key) => {
        const [x, y, z] = key.split(',').map(Number);
        if (val.type === 3) spawn = { x, y, z };
        if (val.type === 2) hasGoal = true;
        if (val.type === 4) movers.push({ x, y, z, ...val.moverConfig });
        else blocks.push({ x, y, z, type: val.type, cpIndex: val.cpIndex });
      });

      return {
        name: inputEditorStageName.value.trim() || "ステージ",
        size: gridSize,
        spawn,
        hasGoal,
        blocks,
        movers
      };
    }

    document.getElementById('btn-admin-save').onclick = async () => {
      if (!currentEditingTarget) return;
      const data = exportStageData();
      if (!data.spawn) { alert("スタート地点(S)が必要です。"); return; }
      if (!data.hasGoal) { alert("ゴール地点(G)が必要です。"); return; }

      try {
        if (currentEditingTarget.type === 'PUBLIC') {
          await db.collection("stages").doc(currentEditingTarget.docId).update({
            ...data,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert(`公開ステージ「${data.name}」を上書き保存しました！`);
        } else {
          await db.collection("users").doc(currentEditingTarget.userId).collection("custom_stages").doc(currentEditingTarget.docId).update({
            ...data,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert(`ユーザー作成中スロット「${data.name}」を上書き保存しました！`);
        }
      } catch (err) {
        alert("保存エラー: " + err.message);
      }
    };

    document.getElementById('btn-admin-test').onclick = () => {
      const data = exportStageData();
      if (!data.spawn) { alert("スタート地点を配置してください。"); return; }
      if (!data.hasGoal) { alert("ゴール地点を配置してください。"); return; }

      editorGroup.visible = false;
      editorUiContainer.classList.add('hidden');
      hudBackEditor.classList.remove('hidden');
      gameState = 'PLAYING';
      tilesGroup.visible = true;
      pivot.visible = true;

      buildPlayStage(data);
      resetCubePosition(data.spawn.x, data.spawn.y, data.spawn.z);
    };

    hudBackEditor.onclick = () => {
      hudBackEditor.classList.add('hidden');
      editorUiContainer.classList.remove('hidden');
      gameState = 'EDITOR';
      tilesGroup.visible = false;
      pivot.visible = false;
      editorGroup.visible = true;
      camera.position.copy(editorCamPos);
      camera.lookAt(editorCamTarget);
    };

    let editingMoverKey = null;
    const modalMover = document.getElementById('editor-modal');
    function openMoverModal(key) {
      editingMoverKey = key;
      const b = editorBlocks.get(key);
      if (b && b.moverConfig) {
        document.getElementById('modal-dir').value = b.moverConfig.dir;
        document.getElementById('modal-dist').value = b.moverConfig.dist;
        document.getElementById('modal-speed').value = b.moverConfig.speed;
        modalMover.classList.remove('hidden');
      }
    }
    document.getElementById('modal-save').onclick = () => {
      if (editingMoverKey && editorBlocks.has(editingMoverKey)) {
        const b = editorBlocks.get(editingMoverKey);
        b.moverConfig.dir = document.getElementById('modal-dir').value;
        b.moverConfig.dist = parseInt(document.getElementById('modal-dist').value, 10);
        b.moverConfig.speed = parseFloat(document.getElementById('modal-speed').value);
      }
      modalMover.classList.add('hidden');
    };
    document.getElementById('modal-cancel').onclick = () => modalMover.classList.add('hidden');

    let editingCpKey = null;
    const modalCp = document.getElementById('modal-checkpoint');
    const inputCpNumber = document.getElementById('cp-number-input');
    function openCpModal(key) {
      editingCpKey = key;
      const b = editorBlocks.get(key);
      if (b) {
        inputCpNumber.value = b.cpIndex || 1;
        modalCp.classList.remove('hidden');
      }
    }
    document.getElementById('cp-modal-save').onclick = () => {
      if (editingCpKey && editorBlocks.has(editingCpKey)) {
        const [x, y, z] = editingCpKey.split(',').map(Number);
        setEditorTile(x, y, z, 6, null, parseInt(inputCpNumber.value, 10) || 1);
      }
      modalCp.classList.add('hidden');
    };
    document.getElementById('cp-modal-cancel').onclick = () => modalCp.classList.add('hidden');

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isLeftDown = false, isRightDown = false, isMiddleDown = false;
    let prevMouse = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
      if (gameState !== 'EDITOR' || e.target.closest('#editor-ui-container, .modal-dialog')) return;
      if (e.button === 0) { isLeftDown = true; handleEditorClick(e); }
      else if (e.button === 1 || (e.button === 2 && e.shiftKey)) { isMiddleDown = true; }
      else if (e.button === 2) { isRightDown = true; }
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (gameState !== 'EDITOR') return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };

      if (isLeftDown && !e.target.closest('#editor-ui-container, .modal-dialog')) handleEditorClick(e);
      if (isMiddleDown) {
        editorCamTheta -= dx * 0.008;
        editorCamPhi = THREE.MathUtils.clamp(editorCamPhi - dy * 0.008, 0.1, Math.PI / 2 - 0.05);
        updateEditorCamPos();
      }
      if (isRightDown) {
        const panSpeed = editorCamRadius * 0.0016;
        const forward = new THREE.Vector3().subVectors(editorCamTarget, camera.position);
        forward.y = 0; forward.normalize();
        const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
        editorCamTarget.addScaledVector(right, -dx * panSpeed);
        editorCamTarget.addScaledVector(forward, dy * panSpeed);
        updateEditorCamPos();
      }
    });

    window.addEventListener('mouseup', () => { isLeftDown = false; isRightDown = false; isMiddleDown = false; });
    window.addEventListener('wheel', (e) => {
      if (gameState === 'EDITOR') {
        e.preventDefault();
        editorCamRadius = THREE.MathUtils.clamp(editorCamRadius * (e.deltaY > 0 ? 1.08 : 0.92), 8, 160);
        updateEditorCamPos();
      }
    }, { passive: false });

    function handleEditorClick(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      if (!raycastPlane) return;
      const intersects = raycaster.intersectObject(raycastPlane);
      if (intersects.length > 0) {
        const pt = intersects[0].point;
        const tx = Math.floor(pt.x + 0.5);
        const tz = Math.floor(pt.z + 0.5);
        if (tx >= 0 && tx < gridSize && tz >= 0 && tz < gridSize) {
          const key = `${tx},${currentLayer},${tz}`;
          if (selectedPalette === 4 && editorBlocks.has(key) && editorBlocks.get(key).type === 4) openMoverModal(key);
          else if (selectedPalette === 6 && editorBlocks.has(key) && editorBlocks.get(key).type === 6) openCpModal(key);
          else setEditorTile(tx, currentLayer, tz, selectedPalette);
        }
      }
    }

    let currentStageData = null;
    let currentCheckpoint = null;
    let isRolling = false;
    let isFallingDown = false;
    let fallVelocity = 0;

    function buildPlayStage(stage) {
      currentStageData = stage;
      while (tilesGroup.children.length > 0) tilesGroup.remove(tilesGroup.children[0]);
      activeMovers = [];
      activeFallingFloors = [];

      stage.blocks.forEach(b => {
        let geo = (b.type === 5) ? fullBlockGeo : thinTileGeo;
        let m = matFloor;
        if (b.type === 5) m = matFull;
        if (b.type === 2) m = matGoal;
        if (b.type === 3) m = matStart;
        if (b.type === 7) m = matFallFloor.clone();
        if (b.type === 6) m = createCheckpointMaterials(b.cpIndex || 1);

        const mesh = new THREE.Mesh(geo, m);
        mesh.position.set(b.x, b.y + ((b.type === 5) ? 0.5 : -0.1), b.z);
        mesh.receiveShadow = true;
        tilesGroup.add(mesh);

        if (b.type === 7) {
          activeFallingFloors.push({ x: b.x, y: b.y, z: b.z, mesh, state: 'IDLE', timer: 0, fallVelocity: 0, initialY: b.y - 0.1 });
        }
      });

      if (stage.movers) {
        stage.movers.forEach(m => {
          const mesh = new THREE.Mesh(thinTileGeo, matMover);
          mesh.position.set(m.x, m.y - 0.1, m.z);
          mesh.receiveShadow = true;
          tilesGroup.add(mesh);
          let vecX = 0, vecY = 0, vecZ = 0;
          if (m.dir === 'UP') vecZ = -1;
          if (m.dir === 'DOWN') vecZ = 1;
          if (m.dir === 'LEFT') vecX = -1;
          if (m.dir === 'RIGHT') vecX = 1;
          if (m.dir === 'Y_UP') vecY = 1;
          if (m.dir === 'Y_DOWN') vecY = -1;
          activeMovers.push({ originX: m.x, originY: m.y, originZ: m.z, vecX, vecY, vecZ, dist: m.dist, speed: m.speed, mesh, currentOffset: 0, direction: 1 });
        });
      }
    }

    function resetCubePosition(x, y, z) {
      isRolling = false;
      isFallingDown = false;
      fallVelocity = 0;
      activeFallingFloors.forEach(ff => {
        ff.state = 'IDLE'; ff.timer = 0; ff.fallVelocity = 0;
        ff.mesh.position.y = ff.initialY; ff.mesh.visible = true; ff.mesh.material.color.setHex(0xf97316);
      });
      cubePos = { x, y, z };
      pivot.position.set(cubePos.x, cubePos.y, cubePos.z);
      pivot.rotation.set(0, 0, 0);
      cubeMesh.position.set(0, 0.5, 0);
      camera.position.set(cubePos.x + 6, cubePos.y + 7.5, cubePos.z + 8);
      cameraTarget.set(cubePos.x, cubePos.y + 0.5, cubePos.z);
    }

    const keys = {};
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        keys[e.key] = true;
      }
    });
    window.addEventListener('keyup', (e) => { if (keys[e.key]) keys[e.key] = false; });

    function getAllSurfacesAt(x, z) {
      const surfaces = [];
      currentStageData.blocks.forEach(b => {
        if (b.x === x && b.z === z) {
          if (b.type === 7) {
            const ff = activeFallingFloors.find(f => f.x === b.x && f.y === b.y && f.z === b.z);
            if (ff && (ff.state === 'FALLING' || ff.state === 'GONE')) return;
          }
          surfaces.push({ type: b.type, mover: null, surfaceY: (b.type === 5) ? b.y + 1 : b.y });
        }
      });
      activeMovers.forEach(m => {
        if (Math.abs(m.mesh.position.x - x) <= 0.85 && Math.abs(m.mesh.position.z - z) <= 0.85) {
          surfaces.push({ type: 4, mover: m, surfaceY: m.mesh.position.y + 0.1 });
        }
      });
      return surfaces.sort((a, b) => b.surfaceY - a.surfaceY);
    }

    function roll(dx, dz) {
      isRolling = true;
      const cx = Math.round(cubePos.x), cz = Math.round(cubePos.z);
      const tx = cx + dx, tz = cz + dz;
      const surfaces = getAllSurfacesAt(tx, tz);
      let best = null, minDiff = 999;
      for (const s of surfaces) {
        const diff = s.surfaceY - cubePos.y;
        if (diff >= -1.4 && diff <= 1.25 && Math.abs(diff) < minDiff) { minDiff = Math.abs(diff); best = s; }
      }
      const surface = best ? { dy: best.surfaceY - cubePos.y, targetY: best.surfaceY, ...best } : { dy: 0, targetY: cubePos.y, type: 0, surfaceY: cubePos.y, isFall: true };

      const startY = cubePos.y;
      const targetY = surface.targetY;
      const dy = targetY - startY;
      const px = cx + dx * 0.5, py = (dy > 0.15) ? (startY + dy) : startY, pz = cz + dz * 0.5;

      pivot.position.set(px, py, pz);
      cubeMesh.position.set(cx - px, startY + 0.5 - py, cz - pz);

      const targetAngle = (Math.abs(dy) > 0.25) ? Math.PI : (Math.PI / 2);
      const rollSpeed = (Math.abs(dy) > 0.25) ? 0.20 : 0.16;
      let angle = 0;
      const axis = new THREE.Vector3(dz, 0, -dx).normalize();

      function anim() {
        angle += rollSpeed;
        if (angle < targetAngle) {
          pivot.rotateOnAxis(axis, rollSpeed);
          requestAnimationFrame(anim);
        } else {
          cubePos.x = tx; cubePos.z = tz; cubePos.y = targetY;
          pivot.position.set(cubePos.x, cubePos.y, cubePos.z);
          pivot.rotation.set(0, 0, 0);
          cubeMesh.position.set(0, 0.5, 0);
          isRolling = false;

          if (surface.type === 6) currentCheckpoint = { ...cubePos };
          if (surface.type === 7) {
            const ff = activeFallingFloors.find(f => f.x === tx && f.y === Math.round(targetY) && f.z === tz);
            if (ff && ff.state === 'IDLE') ff.state = 'COUNTING';
          }
          if (surface.isFall) { isFallingDown = true; fallVelocity = 0.05; }
          else if (surface.type === 2) { alert("ステージクリア！"); hudBackEditor.click(); }
        }
      }
      anim();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function loop() {
      requestAnimationFrame(loop);
      if (gameState === 'PLAYING') {
        activeFallingFloors.forEach(ff => {
          if (ff.state === 'COUNTING') {
            ff.timer += 1 / 60;
            ff.mesh.material.color.setHex((Math.floor(ff.timer * 8) % 2 === 0) ? 0xef4444 : 0xf97316);
            if (ff.timer >= 1.0) {
              ff.state = 'FALLING'; ff.fallVelocity = 0.05;
              if (Math.round(cubePos.x) === ff.x && Math.round(cubePos.z) === ff.z && Math.abs(cubePos.y - ff.y) <= 0.2 && !isRolling) {
                isFallingDown = true; fallVelocity = 0.05;
              }
            }
          } else if (ff.state === 'FALLING') {
            ff.fallVelocity += 0.03;
            ff.mesh.position.y -= ff.fallVelocity;
            if (ff.mesh.position.y < -15) { ff.state = 'GONE'; ff.mesh.visible = false; }
          }
        });

        if (isFallingDown) {
          fallVelocity += 0.03;
          cubePos.y -= fallVelocity;
          pivot.position.y = cubePos.y;
          if (cubePos.y <= -10) {
            if (currentCheckpoint) resetCubePosition(currentCheckpoint.x, currentCheckpoint.y, currentCheckpoint.z);
            else resetCubePosition(currentStageData.spawn.x, currentStageData.spawn.y, currentStageData.spawn.z);
          }
        }

        activeMovers.forEach(m => {
          const delta = m.speed * m.direction;
          m.currentOffset += Math.abs(delta);
          m.mesh.position.x += m.vecX * delta;
          m.mesh.position.y += m.vecY * delta;
          m.mesh.position.z += m.vecZ * delta;
          if (m.currentOffset >= m.dist) { m.direction *= -1; m.currentOffset = 0; }
        });

        if (!isRolling && !isFallingDown) {
          if (keys['ArrowUp']) roll(0, -1);
          else if (keys['ArrowDown']) roll(0, 1);
          else if (keys['ArrowLeft']) roll(-1, 0);
          else if (keys['ArrowRight']) roll(1, 0);
        }

        const cubeWorld = new THREE.Vector3();
        cubeMesh.getWorldPosition(cubeWorld);
        camera.position.x += (cubeWorld.x + 6 - camera.position.x) * 0.06;
        camera.position.y += (cubeWorld.y + 7.5 - camera.position.y) * 0.06;
        camera.position.z += (cubeWorld.z + 8 - camera.position.z) * 0.06;
        cameraTarget.x += (cubeWorld.x - cameraTarget.x) * 0.06;
        cameraTarget.y += (cubeWorld.y + 0.5 - cameraTarget.y) * 0.06;
        cameraTarget.z += (cubeWorld.z - cameraTarget.z) * 0.06;
        camera.lookAt(cameraTarget);
      } else if (gameState === 'EDITOR') {
        camera.position.lerp(editorCamPos, 0.15);
        cameraTarget.lerp(editorCamTarget, 0.15);
        camera.lookAt(cameraTarget);
      }
      renderer.render(scene, camera);
    }
    loop();
  </script>
</body>
</html>
